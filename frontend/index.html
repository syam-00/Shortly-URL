
<!doctype html>
<html lang="en">
  <head>
    <!-- Character encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Shortly - Free URL Shortener | Create Short Links</title>

    <meta
      name="description"
      content="Shorten long URLs instantly with Shortly. Create custom short links, manage your URLs, set expiration dates, and track link analytics easily."
    />

    <meta
      name="keywords"
      content="URL shortener, free URL shortener, short links, custom URL, link management, URL analytics, link tracker"
    />

    <meta name="author" content="Shortly" />

    <meta name="robots" content="index, follow" />

    <!-- Canonical URL: Replace with your actual domain -->
    <link rel="canonical" href="https://shortly1.vercel.app/" />

    <!-- Theme and browser appearance -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shortly" />
    <meta
      property="og:title"
      content="Shortly - Free URL Shortener"
    />
    <meta
      property="og:description"
      content="Create short, custom URLs and track your link performance with Shortly."
    />
    <meta property="og:url" content="https://shortly1.vercel.app/" />
    <meta property="og:image" content="https://shortly1.vercel.app/og-image.png" />
    <meta
      property="og:image:alt"
      content="Shortly - Simple and powerful URL shortener"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Shortly - Free URL Shortener"
    />
    <meta
      name="twitter:description"
      content="Shorten URLs, create custom links, and track clicks with Shortly."
    />
    <meta name="twitter:image" content="https://shortly1.vercel.app/og-image.png" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Shortly",
        "url": "https://shortly1.vercel.app/",
        "description": "A URL shortening platform to create short links, customize URLs, set expiration dates, and track link analytics.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
